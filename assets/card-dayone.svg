<svg width="400" height="250" viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Day One: chat with your codebase. Live demo."><title>Day One</title><defs><linearGradient id="shine" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><clipPath id="pill"><rect x="272" y="200" width="104" height="28" rx="14"/></clipPath><linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F59E0B" stop-opacity=".55"/><stop offset=".35" stop-color="#27272A"/><stop offset="1" stop-color="#27272A"/></linearGradient></defs><style> .sans { font-family: 'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; } .mono { font-family: ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; } .sweep { animation: sweep 3.2s ease-in-out infinite; } @keyframes sweep { 0% { transform: translateX(-120px); } 60%,100% { transform: translateX(140px); } } .ed { animation: flow 1.6s linear infinite; } @keyframes flow { to { stroke-dashoffset: -14; } } .nd { transform-box: fill-box; transform-origin: center; animation: bob 3s ease-in-out infinite; } .n1 { animation-delay: -.6s; } .n2 { animation-delay: -1.2s; } .n3 { animation-delay: -1.8s; } .n4 { animation-delay: -2.4s; } @keyframes bob { 0%,100% { transform: scale(1); } 50% { transform: scale(1.25); } } .pulse { transform-box: fill-box; transform-origin: center; animation: ping 2.2s ease-out infinite; } @keyframes ping { 0% { transform: scale(1); opacity: .8; } 100% { transform: scale(3); opacity: 0; } } @media (prefers-reduced-motion: reduce) { * { animation: none !important; } } </style><rect x=".5" y=".5" width="399" height="249" rx="14" fill="#101014" stroke="url(#edge)"/><text class="mono" x="24" y="38" font-size="11.5" fill="#F59E0B" letter-spacing="1.2">03 / RAG · CODEBASE AI</text><text class="sans" x