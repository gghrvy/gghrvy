<svg width="400" height="250" viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ProspectOS: lead-gen pipeline. Live demo."><title>ProspectOS</title><defs><linearGradient id="shine" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><clipPath id="pill"><rect x="272" y="200" width="104" height="28" rx="14"/></clipPath><linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F59E0B" stop-opacity=".55"/><stop offset=".35" stop-color="#27272A"/><stop offset="1" stop-color="#27272A"/></linearGradient></defs><style> .sans { font-family: 'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; } .mono { font-family: ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; } .sweep { animation: sweep 3.2s ease-in-out infinite; } @keyframes sweep { 0% { transform: translateX(-120px); } 60%,100% { transform: translateX(140px); } } .bar { transform-box: fill-box; transform-origin: left; animation: fill 4s cubic-bezier(.2,.7,.2,1) infinite; } .b1 { animation-delay: .25s; } .b2 { animation-delay: .5s; } .b3 { animation-delay: .75s; } @keyframes fill { 0% { transform: scaleX(0); } 35%,85% { transform: scaleX(1); } 100% { transform: scaleX(0); } } .scan { animation: scan 4s ease-in-out infinite; } @keyframes scan { 0% { transform: translateY(0); opacity: 0; } 10% { opacity: .8; } 60% { transform: translateY(80px); opacity: .8; } 70%,100% { transform: translateY(80px); opacity: 0; } } @media (prefers-reduced-motion: reduce) { * { animation: none !important; } } </style><rect x=".5" y=".5" width="399" height="249" rx="14" fill="#101014" stroke="url(#edge)"/><text class="mono" x="24" y="38" font-size="11.5" fill="#F59E0B" letter-spacing="1.2">01 / LEAD-GEN PIPELINE</text><text class="sans" x="24" y="72" font-size="27" font-weight="800" fill="#FAFAFA" letter-spacing="-.5">ProspectOS</text><rect x="236" y="22" width="140" height="96" rx="10" fill="#0B0B0F" stroke="#1F1F23"/><rect x="250" y="38" width="40" height="6" rx="3" fill="#27272A"/><rect x="298" y="38" width="64" height="6" rx="3" fill="#1C1C20"/><rect class="bar b0" x="298" y="38" width="49" height="6" rx="3" fill="#22C55E"/><rect x="250" y="57" width="40" height="6" rx="3" fill="#27272A"/><rect x="298" y="57" width="64" height="6" rx="3" fill="#1C1C20"/><rect class="bar b1" x="298" y="57" width="33" height="6" rx="3" fill="#F59E0B"/><rect x="250" y="76" width="40" height="6" rx="3" fill="#27272A"/><rect x="298" y="76" width="64" height="6" rx="3" fill="#1C1C20"/><rect class="bar b2" x="298" y="76" width="58" height="6" rx="3" fill="#22C55E"/><rect x="250" y="95" width="40" height="6" rx="3" fill="#27272A"/><rect x="298" y="95" width="64" height="6" rx="3" fill="#1C1C20"/><rect class="bar b3" x="298" y="95" width="21" height="6" rx="3" fill="#71717A"/><rect class="scan" x="240" y="30" width="132" height="2" fill="#F59E0B" opacity=".75"/><text class="sans" x="24" y="146" font-size="13.5" fill="#A1A1AA">Finds local businesses, audits their sites with</text><text class="sans" x="24" y="166" font-size="13.5" fill="#A1A1AA">Playwright, scores leads, drafts outreach for review.</text><rect x="24" y="200" width="67" height="28" rx="8" fill="#16161A" stroke="#27272A"/><text class="mono" x="57.5" y="218.5" font-size="11.5" fill="#D4D4D8" text-anchor="middle">Next.js</text><rect x="99" y="200" width="67" height="28" rx="8" fill="#16161A" stroke="#27272A"/><text class="mono" x="132.5" y="218.5" font-size="11.5" fill="#D4D4D8" text-anchor="middle">FastAPI</text><rect x="174" y="200" width="74" height="28" rx="8" fill="#16161A" stroke="#27272A"/><text class="mono" x="211.0" y="218.5" font-size="11.5" fill="#D4D4D8" text-anchor="middle">Postgres</text><rect x="272" y="200" width="104" height="28" rx="14" fill="#F59E0B"/><g clip-path="url(#pill)"><rect class="sweep" x="272" y="200" width="60" height="28" fill="url(#shine)"/></g><text class="mono" x="324" y="218.5" font-size="11.5" font-weight="700" fill="#1A0F00" text-anchor="middle" letter-spacing=".8">LIVE DEMO →</text></svg>
