<svg width="1200" height="200" viewBox="0 0 1200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Timeline: BS Information Technology, University of San Jose-Recoletos, 2022 to 2026. Software Developer Intern at Xeleqt, March to June 2026. Backend Developer at Woogidex, July 2026 to present."><title>Background</title><defs><linearGradient id="ln" gradientUnits="userSpaceOnUse" x1="50" y1="0" x2="1150" y2="0"><stop offset="0" stop-color="#F59E0B" stop-opacity="0"/><stop offset=".12" stop-color="#F59E0B" stop-opacity=".7"/><stop offset=".8" stop-color="#22C55E" stop-opacity=".8"/><stop offset="1" stop-color="#22C55E" stop-opacity="0"/></linearGradient><radialGradient id="spark"><stop offset="0" stop-color="#FFF7D6"/><stop offset=".4" stop-color="#F59E0B" stop-opacity=".8"/><stop offset="1" stop-color="#F59E0B" stop-opacity="0"/></radialGradient></defs><style> .sans { font-family: 'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; } .mono { font-family: ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; } .track { stroke-dasharray: 1100; stroke-dashoffset: 1100; animation: draw 1.6s cubic-bezier(.4,0,.2,1) .2s forwards; } @keyframes draw { to { stroke-dashoffset: 0; } } .node { opacity: 0; animation: pop .6s cubic-bezier(.2,.7,.2,1) forwards; } @keyframes pop { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } } .ping { transform-box: fill-box; transform-origin: center; animation: ping 2s ease-out 2.4s infinite; opacity: 0; } @keyframes ping { 0% { transform: scale(1); opacity: .8; } 100% { transform: scale(2.8); opacity: 0; } } .spark { opacity: 0; animation: travel 6s ease-in-out 2.4s infinite; } @keyframes travel { 0% { transform: translateX(0); opacity: 0; } 8% { opacity: 1; } 85% { opacity: 1; } 100% { transform: translateX(1000px); opacity: 0; } } @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .node { opacity: 1; } .track { stroke-dashoffset: 0; } } </style><rect width="1200" height="200" rx="14" fill="#0B0B0F"/><line class="track" x1="50" y1="132" x2="1150" y2="132" stroke="url(#ln)" stroke-width="2"/><circle class="spark" cx="100" cy="132" r="7" fill="url(#spark)"/><g class="node" style="animation-delay:0.60s"><text class="mono" x="200" y="44" font-size="12.5" fill="#F59E0B" text-anchor="middle" letter-spacing="1.2">2022 – 2026</text><text class="sans" x="200" y="72" font-size="19" font-weight="800" fill="#FAFAFA" text-anchor="middle">BS Information Technology</text><text class="sans" x="200" y="94" font-size="13.5" fill="#A1A1AA" text-anchor="middle">University of San Jose-Recoletos</text><circle cx="200" cy="132" r="9" fill="#F59E0B" stroke="#0B0B0F" stroke-width="4"/><text class="mono" x="200" y="170" font-size="12" fill="#71717A" text-anchor="middle">Web Apps Development · Solutionsfest 2026 Bronze</text></g><g class="node" style="animation-delay:1.15s"><text class="mono" x="600" y="44" font-size="12.5" fill="#F59E0B" text-anchor="middle" letter-spacing="1.2">MAR – JUN 2026</text><text class="sans" x="600" y="72" font-size="19" font-weight="800" fill="#FAFAFA" text-anchor="middle">Software Developer Intern</text><text class="sans" x="600" y="94" font-size="13.5" fill="#A1A1AA" text-anchor="middle">Xeleqt Technology Innovations (AIoT)</text><circle cx="600" cy="132" r="9" fill="#F59E0B" stroke="#0B0B0F" stroke-width="4"/><text class="mono" x="600" y="170" font-size="12" fill="#71717A" text-anchor="middle">Wix → Next.js + AI chatbot · cross-platform QA</text></g><g class="node" style="animation-delay:1.70s"><text class="mono" x="1000" y="44" font-size="12.5" fill="#22C55E" text-anchor="middle" letter-spacing="1.2">JUL 2026 – NOW</text><text class="sans" x="1000" y="72" font-size="19" font-weight="800" fill="#FAFAFA" text-anchor="middle">Backend Developer</text><text class="sans" x="1000" y="94" font-size="13.5" fill="#A1A1AA" text-anchor="middle">Woogidex (remote, collaborative)</text>